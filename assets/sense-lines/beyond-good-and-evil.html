<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nietzsche</title>
<style>
/* One book, laid out ahead of time (book.py), read one page at a time.
   The page is the unit: text flows on through the numbered sections, and a page ends only when it
   is full. While you read there is only the page and a small folio; a tap in the middle of the
   page shows the controls. A sentence taller than the screen has a page of its own, read in
   steps of whole lines. Made for the Daylight's paper-like screen: everything is ink on paper,
   the hierarchy is in size, italics and small capitals, and nothing moves. */
@font-face { font-family: "Literata"; src: url("fonts/Literata[opsz,wght].ttf") format("truetype"); font-weight: 200 900; font-style: normal; font-display: block; }
@font-face { font-family: "Literata"; src: url("fonts/Literata-Italic[opsz,wght].ttf") format("truetype"); font-weight: 200 900; font-style: italic; font-display: block; }
:root {
  --paper: #f7f5ef; --ink: #161514; --soft: #3a3733; --rule: rgba(22, 21, 20, 0.22); --guide: rgba(22, 21, 20, 0.5);
  --accent: #6b2318;
  --size: 21px; --step: 1.05em; --column: calc(var(--size) * 31); --gutter: max(28px, 5vw);
  font-family: "Literata", "Iowan Old Style", Charter, Georgia, serif;
  font-optical-sizing: auto;
}
:root[data-theme="dark"] {
  --paper: #121110; --ink: #ece7db; --soft: #cfc8b9; --rule: rgba(236, 231, 219, 0.24); --guide: rgba(236, 231, 219, 0.5);
  --accent: #e0b3a1; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-size: var(--size); line-height: 1.5; overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  font-kerning: normal; font-variant-ligatures: common-ligatures;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* ---------- the page ---------- */
#stage {
  position: absolute; inset: 0; margin: 0 auto; max-width: calc(var(--column) + 2 * var(--gutter));
  padding: max(44px, env(safe-area-inset-top)) var(--gutter) max(64px, env(safe-area-inset-bottom));
}
#view { height: 100%; overflow: hidden; position: relative; }
#page { position: relative; }
#cover { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); pointer-events: none; }
#rail { position: absolute; top: max(44px, env(safe-area-inset-top)); bottom: max(64px, env(safe-area-inset-bottom)); right: calc(var(--gutter) / 2 - 1px); width: 3px; }
#rail::before { content: ""; position: absolute; left: 1px; top: 0; bottom: 0; width: 1px; background: var(--rule); }
#rail i { position: absolute; left: 0; width: 3px; background: var(--ink); }
/* the folio: where you are, always there, never loud */
#folio {
  position: absolute; left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom)); text-align: center;
  font-size: 16px; line-height: 1; color: var(--soft); font-variant-caps: all-small-caps; letter-spacing: 0.1em;
  font-variant-numeric: oldstyle-nums; pointer-events: none;
}
#folio button { pointer-events: auto; min-height: 54px; padding: 0 18px; margin-top: -19px; color: inherit; font: inherit; letter-spacing: inherit; }
#folio .more { font-variant-caps: normal; font-style: italic; letter-spacing: 0; color: var(--ink); }

/* a chapter opens as in a printed book */
.chapter { text-align: center; padding-top: 12vh; margin-bottom: 2.2em; }
.chapter .t { font-size: 1.5em; line-height: 1.25; font-weight: 500; letter-spacing: 0.01em; text-wrap: balance; }
.chapter .orn { display: block; margin: 0.8em auto 0; width: 2.2em; height: 1px; background: var(--ink); }
.num { text-align: center; font-variant-caps: all-small-caps; letter-spacing: 0.14em; font-size: 0.95em; margin: 2em 0 0.8em; font-variant-numeric: oldstyle-nums; }
.head { text-align: center; font-style: italic; margin: 0.4em 0 1em; text-wrap: balance; }
.num.first, .chapter + .num { margin-top: 0; }
.unit + .unit { margin-top: 0.62em; }
.unit.para { margin-top: 1.2em; }
.unit.first { margin-top: 0; }
.num + .unit, .head + .unit, .chapter + .unit { margin-top: 0; }
em { font-style: italic; }
.note { font-size: 0.84em; padding-left: 1em; border-left: 1px solid var(--rule); }
.note::before { content: "Note. "; font-variant-caps: all-small-caps; letter-spacing: 0.06em; }
.verse { white-space: pre-line; font-style: italic; }

/* sense lines: short lines need less space between them than a full paragraph, and the block
   stands a little in from the left so that the page balances */
.lines { line-height: 1.36; }
.lines > .unit:not(.chapter):not(.num):not(.head) { margin-left: 8%; }
.piece { position: relative; }
.piece + .piece { margin-top: 0.3em; }
.l { padding-left: calc(var(--lv) * var(--step) + 1.2em); text-indent: -1.2em; }
.hang { margin-left: -0.45em; }
.hang.one { margin-left: -0.24em; }
.plain { margin: 0; }
svg.guides { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
svg.guides path { fill: none; stroke: var(--guide); stroke-width: 1; shape-rendering: crispEdges; }

/* plain text: a justified page with hyphens, paragraphs marked by an indent */
.prose p { margin: 0; text-align: justify; hyphens: auto; -webkit-hyphens: auto; text-indent: 1.4em; }
.prose p.first, .prose .chapter + p, .prose .num + p, .prose .head + p { text-indent: 0; }
.prose p.unit + p.unit { margin-top: 0; }
.prose .verse { padding-left: 1.4em; }

/* ---------- the controls: shown by a tap in the middle of the page ---------- */
.bar {
  position: absolute; left: 0; right: 0; background: var(--paper); z-index: 3;
  padding-left: max(var(--gutter), env(safe-area-inset-left)); padding-right: max(var(--gutter), env(safe-area-inset-right));
}
.bar .in { max-width: var(--column); margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 64px; }
#top { top: 0; padding-top: max(8px, env(safe-area-inset-top)); border-bottom: 1px solid var(--ink); }
#bottom { bottom: 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--ink); }
.bar button, .bar a { min-height: 54px; min-width: 54px; display: inline-flex; align-items: center; font-size: 17px; color: var(--ink); text-decoration: none; }
#shelf { padding-right: 8px; white-space: nowrap; }
#where { flex: 1; min-width: 0; justify-content: flex-start; text-align: left; overflow: hidden; }
#where span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#where b { font-weight: 600; font-variant-caps: all-small-caps; letter-spacing: 0.06em; font-size: 1.05em; }
#where i { font-style: italic; }
.toggle { display: inline-flex; border: 1px solid var(--ink); border-radius: 999px; padding: 3px; flex: none; }
.toggle button { padding: 0 20px; border-radius: 999px; min-height: 48px; justify-content: center; }
.toggle button.on { background: var(--ink); color: var(--paper); }
#bottom .in { gap: 18px; }
#bottom .track { flex: 1; height: 54px; position: relative; }
#bottom .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--rule); }
#bottom .track i { position: absolute; left: 0; top: calc(50% - 1.5px); height: 3px; background: var(--ink); }
#percent { font-size: 17px; font-variant-numeric: oldstyle-nums; white-space: nowrap; }

/* ---------- embedded in a web page (reader.html?embed): the bar stays, the page fits under it,
   and there is no library to go back to ---------- */
.embed #shelf, .embed .top a { display: none !important; }   /* embedded: no library to go back to */

/* at night, what is "on" is a soft fill, never a block of light */
:root[data-theme="dark"] .toggle { border-color: var(--rule); }
:root[data-theme="dark"] .toggle button.on, :root[data-theme="dark"] #contents .secs button.here { background: rgba(236, 231, 219, 0.14); color: var(--ink); }
:root[data-theme="dark"] #top, :root[data-theme="dark"] #bottom { border-color: var(--rule); }

/* ---------- contents and settings ---------- */
#contents { position: absolute; inset: 0; background: var(--paper); overflow-y: auto; z-index: 5; padding: max(20px, env(safe-area-inset-top)) var(--gutter) 48px; }
#contents .wrap { max-width: var(--column); margin: 0 auto; display: grid; gap: 26px; }
#contents .top { display: flex; justify-content: space-between; align-items: center; }
#contents .top a, #contents .top button { font-size: 17px; min-height: 54px; display: inline-flex; align-items: center; color: var(--ink); text-decoration: none; }
#contents h1 { font-size: 1.6em; font-weight: 500; margin: 0; line-height: 1.2; text-wrap: balance; }
#contents .by { font-style: italic; font-size: 0.85em; margin-top: 6px; color: var(--soft); }
#contents .row { display: flex; flex-wrap: wrap; gap: 6px 26px; align-items: center; font-size: 17px; }
#contents .row .k { font-variant-caps: all-small-caps; letter-spacing: 0.1em; color: var(--soft); }
#contents .row button { min-height: 54px; min-width: 54px; }
#contents .row button.on { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }
#contents .ch { display: grid; gap: 4px; border-top: 1px solid var(--rule); padding-top: 10px; }
#contents .ch > button { text-align: left; font-size: 19px; min-height: 54px; font-weight: 500; }
#contents .ch > button.here::after { content: "  ·  you are here"; font-weight: 400; font-style: italic; font-size: 0.8em; }
#contents .secs { display: flex; flex-wrap: wrap; gap: 2px; }
#contents .secs button { font-size: 17px; min-width: 54px; min-height: 54px; text-align: center; border-radius: 8px; font-variant-numeric: oldstyle-nums; }
#contents .secs button.here { color: var(--paper); background: var(--ink); }
</style>
</head>
<body>
<main id="stage"><div id="view"><div id="page"></div><div id="cover" hidden></div></div><div id="rail" hidden><i></i></div></main>
<div id="folio"></div>
<header id="top" class="bar" hidden><div class="in">
  <a id="shelf" href="index.html">← Library</a>
  <button id="where" type="button"><span></span></button>
  <span class="toggle" role="group" aria-label="Layout">

  </span>
</div></header>
<footer id="bottom" class="bar" hidden><div class="in">
  <span class="track"><i id="progress"></i></span>
  <span id="percent"></span>
</div></footer>
<div id="contents" hidden></div>

   chapter title, a section number, a sentence, a note, a stanza. The units of a chapter flow
   on through its sections; only a chapter starts a new page. ---------- */
const chapters = BOOK.chapters.map((chapter) => {
  const title = chapter.title || BOOK.title;
  const units = [{ kind: "chapter", text: title, n: null }];
  chapter.sections.forEach((section) => {
    const n = section.n;
    const versed = section.paragraphs.length > 0 && section.paragraphs.every((p) => p.verse);
    if (n != null) units.push({ kind: "num", text: versed ? String(n) : "§ " + n, n });
    section.paragraphs.forEach((p, pi) => {
      if (p.verse) { units.push({ kind: "verse", lines: p.verse, para: true, n }); return; }
      if (p.head) { units.push({ kind: "head", text: p.head, n }); return; }
      (p.sentences || []).forEach((s, si) => units.push({ kind: "sentence", pieces: s, para: si === 0 && pi > 0, n }));
      (p.notes || []).forEach((note) => units.push({ kind: "note", text: note, para: true, n }));
    });
  });
  return { title, units };
});
const before = [];   // units before each chapter, for the progress through the whole book
let total = 0;
chapters.forEach((c) => { before.push(total); total += c.units.length; });
const heading = (u) => u.kind === "chapter" || u.kind === "num" || u.kind === "head";

/* ---------- settings and place, kept in this browser: the place for each book, the layout,
   the type size and day or night for all books ---------- */
const SLUG = BOOK.slug || "book";
const EMBED = new URLSearchParams(location.search).has("embed");
if (EMBED) document.documentElement.classList.add("embed");
const store = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};
/* settings kept by an earlier version under their old names move to these */
try {
  for (const k of ["mode", "size", "theme", "last", "seen"]) {
    const old = localStorage.getItem("cascade:" + k);
    if (old != null && localStorage.getItem("reader:" + k) == null) localStorage.setItem("reader:" + k, k === "mode" && old === '"cascade"' ? '"lines"' : old);
  }
} catch {}
let mode = store.get("reader:mode", "lines");
let size = store.get("reader:size", 21);
let theme = store.get("reader:theme", "light");
let at = store.get(SLUG + ":at", { c: 0, u: 0 });   // the chapter, and the first unit of the page
if (at.c == null && at.s != null) {
  // a place kept by an older version (a count of sections): the start of that section
  let k = 0, found = { c: 0, u: 0 };
  BOOK.chapters.forEach((chapter, c) => chapter.sections.forEach((section) => {
    if (!section.paragraphs.length) return;
    if (k === at.s) found = { c, u: Math.max(0, chapters[c].units.findIndex((x) => x.n === section.n && x.kind !== "chapter")) };
    k++;
  }));
  at = found;
}
if (!chapters[at.c] || !chapters[at.c].units[at.u]) at = { c: 0, u: 0 };

/* ---------- drawing ---------- */
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function segs(parent, segments, hang) {
  segments.forEach(([text, em], i) => {
    let target = parent;
    if (em) { target = el("em"); parent.append(target); }
    // an opening quote at the start of a line hangs in the margin, so the words stay aligned
    if (hang && i === 0 && /^[“‘]/.test(text)) {
      target.append(el("span", text[0] === "‘" ? "hang one" : "hang", text[0]));
      text = text.slice(1);
    }
    target.append(text);
  });
  return parent;
}
function pieceText(piece) { return piece.lines ? piece.lines.map(([, s]) => s) : [piece.segments]; }

function drawUnit(u, prose) {
  if (u.kind === "chapter") { const d = el("div", "unit chapter"); d.append(el("div", "t", u.text), el("span", "orn")); return d; }
  if (u.kind === "num") return el("div", "unit num", u.text);
  if (u.kind === "head") return el("div", "unit head", u.text);
  const d = el("div", "unit" + (u.para ? " para" : ""));
  if (u.kind === "note") { d.classList.add("note"); d.textContent = u.text; return d; }
  if (u.kind === "verse") { d.classList.add("verse"); d.textContent = u.lines.join("\n"); return d; }
  if (prose) {
    let last = "";
    u.pieces.forEach((piece) => pieceText(piece).forEach((s) => {
      if (last && !/[—–]$/.test(last)) d.append(" ");   // a dash joins the next word with no space
      segs(d, s);
      last = s.map(([t]) => t).join("");
    }));
    return d;
  }
  for (const piece of u.pieces) {
    const block = el("div", "piece");
    if (piece.lines) {
      for (const [lv, s] of piece.lines) {
        const line = segs(el("div", "l"), s, true);
        line.style.setProperty("--lv", lv);
        line.dataset.lv = lv;
        block.append(line);
      }
    } else block.append(segs(el("p", "plain"), piece.segments));
    d.append(block);
  }
  return d;
}

/* A page under construction. In plain text the sentences of one paragraph join into one block. */
function builder(prose) {
  pageEl.replaceChildren();
  pageEl.className = prose ? "prose" : "lines";
  let para = null, count = 0;
  return (u) => {
    const d = drawUnit(u, prose);
    if (prose && u.kind === "sentence") {
      if (!para || u.para) {
        para = el("p", "unit" + (u.para && count ? " para" : "") + (count ? "" : " first"));
        pageEl.append(para);
      } else if (!/[—–]$/.test(para.textContent)) para.append(" ");
      para.append(...d.childNodes);
    } else {
      para = null;
      if (!count) d.classList.add("first");
      pageEl.append(d);
    }
    count++;
  };
}

/* the guides: a thin line from a phrase down to a phrase that hangs on it from two or more
   lines away, with a tick at each phrase that hangs on it. Where the one phrase under it is on the
   next line, the indent alone says it. */
function guides(block) {
  const lines = [...block.querySelectorAll(":scope > .l")];
  if (lines.length < 3) return;
  const base = block.getBoundingClientRect();
  const geo = lines.map((l) => {
    const range = document.createRange();
    range.selectNodeContents(l);
    const r = range.getClientRects()[0] || l.getBoundingClientRect();
    const hung = l.querySelector(".hang") ? r.width : 0;
    return { lv: +l.dataset.lv, x: Math.round(r.left - base.left + (hung ? 0 : 0)), bottom: r.bottom - base.top, mid: Math.round((r.top + r.bottom) / 2 - base.top) + 0.5 };
  });
  const kids = new Map();
  geo.forEach((g, i) => {
    if (!g.lv) return;
    for (let j = i - 1; j >= 0; j--) {
      if (geo[j].lv === g.lv - 1) { if (!kids.has(j)) kids.set(j, []); kids.get(j).push(i); return; }
      if (geo[j].lv < g.lv - 1) return;
    }
  });
  let d = "";
  for (const [p, cs] of kids) {
    if (cs[cs.length - 1] === p + 1) continue;   // its one phrase is on the next line: no guide
    const x = geo[p].x + 3.5, y0 = Math.round(geo[p].bottom) + 1;
    d += `M${x} ${y0}V${geo[cs[cs.length - 1]].mid}`;
    for (const c of cs) { const end = geo[c].x - 7; if (end > x + 2) d += `M${x} ${geo[c].mid}H${end}`; }
  }
  if (!d) return;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "guides");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  svg.append(path);
  block.prepend(svg);
}

/* ---------- pages: the units of a chapter, cut where the page is full. A heading never ends a
   page: it goes over with the text it heads. ---------- */
const cut = new Map();
function fits() { return pageEl.offsetHeight <= view.clientHeight; }
function paginate(c) {
  const key = [c, mode, size, view.clientWidth, view.clientHeight].join(":");
  if (cut.has(key)) return cut.get(key);
  const units = chapters[c].units, prose = mode === "prose", starts = [];
  let i = 0;
  while (i < units.length) {
    const start = i;
    const add = builder(prose);
    add(units[i++]);
    while (i < units.length) {
      add(units[i]);
      if (!fits()) break;
      i++;
    }
    if (i < units.length) {
      let end = i;
      while (end - 1 > start && heading(units[end - 1])) end--;
      // only headings would be left: the text they head comes on this page too (it will scroll)
      i = units.slice(start, end).every(heading) ? i + 1 : end;
    }
    starts.push(start);
  }
  cut.set(key, starts);
  return starts;
}
function pageOf(starts, u) { let p = 0; starts.forEach((s, i) => { if (s <= u) p = i; }); return p; }

/* ---------- a page taller than the screen: read in steps of whole lines ---------- */
let rows = [];   // the lines of a tall page: [{top, bottom}] within the page
function measureRows() {
  const base = pageEl.getBoundingClientRect().top;
  const found = [], range = document.createRange();
  const walker = document.createTreeWalker(pageEl, NodeFilter.SHOW_TEXT);
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    if (!node.nodeValue.trim()) continue;
    range.selectNodeContents(node);
    for (const r of range.getClientRects()) {
      if (r.height < 4 || r.width < 1) continue;
      const top = r.top - base, bottom = r.bottom - base;
      const same = found.find((f) => top < f.bottom - 4 && bottom > f.top + 4);
      if (same) { same.top = Math.min(same.top, top); same.bottom = Math.max(same.bottom, bottom); } else found.push({ top, bottom });
    }
  }
  // a row is its line's own height, not the taller box of its letters: rows then do not overlap
  const lh = parseFloat(getComputedStyle(pageEl).lineHeight) || 28;
  for (const f of found) {
    if (f.bottom - f.top > lh) { const mid = (f.top + f.bottom) / 2; f.top = mid - lh / 2; f.bottom = mid + lh / 2; }
  }
  rows = found.sort((a, b) => a.top - b.top);
}
function tall() { return pageEl.offsetHeight > view.clientHeight + 1; }
function atEnd() { return !tall() || view.scrollTop + view.clientHeight >= pageEl.offsetHeight - 2; }
function frame() {
  const cover = $("cover"), rail = $("rail");
  if (!tall()) { cover.hidden = rail.hidden = true; return; }
  // no line is ever cut: paper covers the first line that does not fit whole
  const edge = view.scrollTop + view.clientHeight;
  const split = rows.find((r) => r.bottom > edge + 0.5 && r.top < edge);
  cover.hidden = !split;
  if (split) cover.style.height = Math.ceil(edge - split.top + 1) + "px";
  rail.hidden = false;
  const thumb = rail.firstElementChild, whole = pageEl.offsetHeight;
  thumb.style.top = (view.scrollTop / whole * 100) + "%";
  thumb.style.height = (view.clientHeight / whole * 100) + "%";
}
function step(forward) {
  const top = view.scrollTop, edge = top + view.clientHeight;
  if (forward) {
    // go on from the last line that was whole on the screen, so one line is read twice
    const whole = rows.filter((r) => r.top >= top - 1 && r.bottom <= edge + 0.5);
    const from = whole.length > 1 ? whole[whole.length - 1] : rows.find((r) => r.bottom > edge + 0.5);
    view.scrollTop = Math.min(from ? Math.round(from.top) : edge, pageEl.offsetHeight - view.clientHeight);
  } else {
    const want = top - view.clientHeight + (rows[0] ? rows[0].bottom - rows[0].top : 0);
    const row = rows.find((r) => r.top >= want);
    view.scrollTop = Math.max(0, row ? Math.round(row.top) : 0);
  }
  frame();
  folio();
}

/* ---------- showing a page ---------- */
let starts = [], page = 0;
function show() {
  starts = paginate(at.c);
  page = pageOf(starts, at.u);
  at.u = starts[page];
  const units = chapters[at.c].units, end = starts[page + 1] ?? units.length;
  const add = builder(mode === "prose");
  units.slice(at.u, end).forEach(add);
  if (mode === "lines") for (const b of pageEl.querySelectorAll(".piece")) guides(b);
  view.scrollTop = 0;
  if (tall()) measureRows();
  frame();
  folio();
  const done = (before[at.c] + end) / total;
  $("progress").style.width = (done * 100).toFixed(2) + "%";
  $("percent").textContent = Math.round(done * 100) + "% of the book";
  const here = units[at.u], title = chapters[at.c].title;
  const where = $("where").firstElementChild;
  where.replaceChildren(el("b", null, BOOK.title.replace(/[:;(].*$/, "")));
  if (title !== BOOK.title) where.append("  ·  ", el("i", null, title));
  $("as-prose").classList.toggle("on", mode === "prose");
  $("as-lines").classList.toggle("on", mode === "lines");
  store.set(SLUG + ":at", at);
  store.set(SLUG + ":done", done);
  store.set("reader:last", { slug: SLUG, title: BOOK.title, where: title === BOOK.title ? "" : title, n: section() });
}
/* the section the page is in: the last section number at or before the end of the page */
function section() {
  const units = chapters[at.c].units, end = (starts[page + 1] ?? units.length) - 1;
  for (let i = end; i >= 0; i--) if (units[i].n != null) return units[i].n;
  return null;
}
function folio() {
  const n = section(), box = $("folio");
  const parts = [n != null ? "§ " + n : "", `${page + 1} of ${starts.length}`].filter(Boolean).join("  ·  ");
  const b = el("button", null, parts);
  b.type = "button";
  b.title = "Show the controls";
  b.addEventListener("click", () => chrome($("top").hidden));   // the folio also opens the controls
  box.replaceChildren(b);
  if (!atEnd()) b.append("  ·  ", el("span", "more", "the sentence goes on"));
}

/* ---------- moving ---------- */
function next() {
  chrome(false);
  if (!atEnd()) return step(true);
  if (page + 1 < starts.length) at = { c: at.c, u: starts[page + 1] };
  else if (at.c + 1 < chapters.length) at = { c: at.c + 1, u: 0 };
  else return;
  show();
}
function previous() {
  chrome(false);
  if (tall() && view.scrollTop > 2) return step(false);
  if (page > 0) at = { c: at.c, u: starts[page - 1] };
  else if (at.c > 0) { const s = paginate(at.c - 1); at = { c: at.c - 1, u: s[s.length - 1] }; }
  else return;
  show();
}
function go(c, n) {
  const u = n == null ? 0 : Math.max(0, chapters[c].units.findIndex((x) => x.kind === "num" && x.n === n));
  at = { c, u };
  closeContents();
  chrome(false);
  show();
  // a section that starts in the middle of a page: the page that holds its number
}
function setMode(m) { mode = m; store.set("reader:mode", mode); show(); }
function setTheme(t) {
  theme = t;
  store.set("reader:theme", t);
  document.documentElement.dataset.theme = t;
  if (!$("contents").hidden) openContents();
}
function setSize(px) {
  size = Math.max(16, Math.min(32, px));
  store.set("reader:size", size);
  document.documentElement.style.setProperty("--size", size + "px");
  show();
  if (!$("contents").hidden) openContents();
}
function chrome(on) {
  $("top").hidden = $("bottom").hidden = !on;
}
$("as-prose").addEventListener("click", () => setMode("prose"));
$("as-lines").addEventListener("click", () => setMode("lines"));

/* ---------- contents and settings ---------- */
function openContents() {
  const box = $("contents"), wrap = el("div", "wrap"), top = el("div", "top");
  const shelf = el("a", null, "← Library");
  shelf.href = "index.html";
  const close = el("button", null, "Back to the page");
  close.addEventListener("click", closeContents);
  top.append(shelf, close);
  const head = el("div");
  head.append(el("h1", null, BOOK.title), el("div", "by", [BOOK.author, BOOK.translator && "translated by " + BOOK.translator].filter(Boolean).join(" · ")));
  const settings = el("div", "row");
  const button = (label, on, act) => { const b = el("button", on ? "on" : "", label); b.addEventListener("click", act); return b; };
  settings.append(el("span", "k", "Type"), button("Smaller", false, () => setSize(size - 1)), button("Larger", false, () => setSize(size + 1)));
  settings.append(el("span", "k", "Paper"), button("Day", theme === "light", () => setTheme("light")), button("Night", theme === "dark", () => setTheme("dark")));
  wrap.append(top, head, settings);
  const now = section();
  chapters.forEach((chapter, c) => {
    const ch = el("div", "ch");
    const title = el("button", at.c === c ? "here" : "", chapter.title);
    title.addEventListener("click", () => go(c, null));
    ch.append(title);
    const nums = chapter.units.filter((u) => u.kind === "num");
    if (nums.length > 1) {
      const row = el("div", "secs");
      for (const u of nums) {
        const b = el("button", at.c === c && u.n === now ? "here" : "", String(u.n));
        b.addEventListener("click", () => go(c, u.n));
        row.append(b);
      }
      ch.append(row);
    }
    wrap.append(ch);
  });
  box.replaceChildren(wrap);
  box.hidden = false;
  const here = box.querySelector(".secs .here, .ch > .here");
  if (here) here.scrollIntoView({ block: "center" });
}
function closeContents() { $("contents").hidden = true; }
$("where").addEventListener("click", openContents);

/* ---------- keys, taps and swipes ---------- */
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("contents").hidden) { if (e.key === "Escape" || e.key === "c") { closeContents(); e.preventDefault(); } return; }
  const k = e.key;
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "j", "l", "n"].includes(k) && !e.shiftKey) next();
  else if (["ArrowLeft", "ArrowUp", "PageUp", "k", "h", "p"].includes(k) || (k === " " && e.shiftKey)) previous();
  else if (k === "t") setMode(mode === "prose" ? "lines" : "prose");
  else if (k === "c") openContents();
  else if (k === "m" || k === "Escape") chrome($("top").hidden);
  else if (k === "+" || k === "=") setSize(size + 1);
  else if (k === "-" || k === "_") setSize(size - 1);
  else return;
  e.preventDefault();
});
/* a tap on the left third goes back, on the right third goes on, in the middle shows or hides the
   controls; a swipe turns the page too */
let touch = null, swiped = false;
stage.addEventListener("touchstart", (e) => { const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY }; swiped = false; }, { passive: true });
stage.addEventListener("touchend", (e) => {
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  touch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 40) return;
  swiped = true;
  if (Math.abs(dx) > Math.abs(dy)) (dx < 0 ? next : previous)();
  else (dy < 0 ? next : previous)();
});
const opened = Date.now();
// the whole screen turns the page, the margins beside the text column too
document.addEventListener("click", (e) => {
  if (e.target.closest("#top, #bottom, #contents, #folio, button, a")) return;
  if (swiped) { swiped = false; return; }
  if (Date.now() - opened < 800) return;   // the tap that opened the book can land here too
  const x = e.clientX / innerWidth;
  if (x < 1 / 3) previous();
  else if (x > 2 / 3) next();
  else chrome($("top").hidden);
});

let resizing = 0;
addEventListener("resize", () => { clearTimeout(resizing); resizing = setTimeout(show, 120); });
document.documentElement.dataset.theme = theme;
document.documentElement.style.setProperty("--size", size + "px");
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { cut.clear(); show(); });
show();
/* the controls are shown when a book opens, so that you know they are there; the first page turn
   puts them away */
chrome(true);
</script>
</body>
</html>
